<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulação CBMMG - COBOM-BH</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="./vendor/leaflet.css" />
    <link rel="stylesheet" href="./vendor/leaflet-routing-machine.css" />
    <!-- App CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- Botão flutuante para mostrar a sidebar quando oculta -->
<button id="sidebarShowBtn" class="btn-floating hidden">☰</button>
    <!-- Sidebar / Painel Lateral -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>COBOM-BH<br>
                 Articulação CBMMG
            </h2>
            <button id="sidebarToggle" class="btn-icon" title="Recolher/Expandir">☰</button>
        </div>
        <div id="status-indicator" class="status-indicator offline">Offline</div>
        <div id="auth-section">
            <button id="adminLoginBtn" class="btn btn-sm">🔑 Login Admin</button>
            <button id="adminLogoutBtn" class="btn btn-sm hidden">🔓 Sair Admin</button>
        </div>
        <div class="search-container">
            <div class="search-container">
                    <div class="search-input-group">
                        <input type="text" id="searchInput" placeholder="Pesquisar endereço, local ou coordenada...">
                        <button id="searchBtn" class="btn" title="Buscar Endereço">🔍</button>
                    </div>

                    <!-- Grid de Ações Rápidas de Origem -->
                    <div class="btn-grid-actions">
                        <button id="useMyLocationBtn" class="btn" title="Usar localização GPS">📍 GPS Atual</button>
                        <button id="mapOriginBtn" class="btn" title="Clique no mapa para marcar origem">🎯 Origem no Mapa</button>
                    </div>
                    
                <button id="resetBtn" class="btn btn-danger">🗑️ Limpar Pesquisa</button>

                <!-- Lista de Resultados de Geocodificação -->
                <div id="searchResults"></div>

                <!-- Painel Princial de Unidades Ranqueadas e Jurisdição (ETA) -->
                <div id="distanceResults" class="dispatch-results-container"></div>
        </div>
        <div id="adminTools" class="hidden">
            <h3>Ferramentas Admin</h3>
            <div id="dropZone" class="drop-zone">
                Arraste e solte .kml/.kmz/.json/.geojson aqui ou clique para enviar
                <input type="file" id="fileInput" accept=".kml,.kmz,.json,.geojson" multiple hidden>
            </div>
            <button id="addMarkerBtn" class="btn">Adicionar POI</button>
            <button id="addPolygonBtn" class="btn">Desenhar Polígono</button>
            <button id="exportBackupBtn" class="btn">Exportar Backup</button>
            <button id="importBackupBtn" class="btn">Importar Backup</button>
            <input type="file" id="importFileInput" accept=".json" hidden>
            <button id="clearRoutesCacheBtn" class="btn">Limpar Cache de Rotas</button>
            <button id="downloadTilesBtn" class="btn">Baixar Tiles Offline</button>
            <!-- Modal para configurar download de tiles -->
            <div id="tileModal" class="modal hidden">
                <div class="modal-content">
                    <span class="close-modal" id="closeTileModal">&times;</span>
                    <h3>Download de Tiles</h3>
                    <label>Zoom mínimo: <input type="number" id="minZoom" value="10" min="0" max="18"></label><br>
                    <label>Zoom máximo: <input type="number" id="maxZoom" value="14" min="0" max="18"></label><br>
                    <button id="startTileDownload" class="btn">Iniciar Download</button>
                    <div id="tileProgress"></div>
                </div>
            </div>
        </div>
        <div id="layerList">
            <h3>Camadas</h3>
            <ul id="layersUl"></ul>
        </div>
        <div id="viewControls">
    <h3>Visualização</h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <label>
            <input type="checkbox" class="view-checkbox" data-mode="all" checked> Todas
        </label>
        <label>
            <input type="checkbox" class="view-checkbox" data-mode="points"> Pontos
        </label>
        <label>
            <input type="checkbox" class="view-checkbox" data-mode="none"> Limpo
        </label>
    </div>
</div>  
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Modal de Login Admin -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="closeLoginModal">&times;</span>
            <h3>Login Administrador</h3>
            <input type="password" id="pinInput" placeholder="Digite o PIN">
            <button id="confirmLoginBtn" class="btn">Entrar</button>
            <p id="loginError" style="color:red;"></p>
        </div>
    </div>

    <!-- Modal de Edição de Feição -->
    <div id="editFeatureModal" class="modal hidden">
        <div class="modal-content modal-edit-feature">
            <span class="close-modal" id="closeEditFeatureModal">&times;</span>
            <h3 id="editFeatureModalTitle">✏️ Editar Feição</h3>
            <div id="editFeatureCategory" class="edit-feature-subtitle"></div>
            
            <form id="editFeatureForm" onsubmit="return false;">
                <div id="editFeatureFieldsContainer" class="edit-feature-fields"></div>
                
                <div class="edit-feature-custom-actions">
                    <button type="button" id="addCustomPropBtn" class="btn" style="background:#34495e; font-size:12px;">+ Adicionar Campo</button>
                    <button type="button" id="toggleJsonModeBtn" class="btn" style="background:#7f8c8d; font-size:12px;">📋 Alternar Modo JSON</button>
                </div>

                <div id="editFeatureJsonContainer" class="hidden" style="margin-top:10px;">
                    <label style="font-size:12px; font-weight:bold; color:#555;">GeoJSON Bruto:</label>
                    <textarea id="editFeatureJsonTextarea" rows="8" style="width:100%; font-family:monospace; font-size:11px; padding:6px; border:1px solid #ccc; border-radius:4px; resize:vertical;"></textarea>
                </div>

                <div class="modal-footer" style="margin-top:15px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                    <button type="button" id="deleteFeatureBtn" class="btn" style="background:#e74c3c; color:white;">🗑️ Excluir</button>
                    <div style="display:flex; gap:8px;">
                        <button type="button" id="cancelEditFeatureBtn" class="btn" style="background:#95a5a6; color:white;">Cancelar</button>
                        <button type="button" id="saveFeatureBtn" class="btn" style="background:#27ae60; color:white; font-weight:bold;">💾 Salvar Alterações</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts das bibliotecas locais -->
    <script src="./vendor/leaflet.js"></script>
    <script src="./vendor/leaflet-routing-machine.js"></script>
    <script src="./vendor/dexie.js"></script>
    <script src="./vendor/turf.min.js"></script>
    <script src="./vendor/jszip.min.js"></script>
    <script src="./vendor/togeojson.umd.js"></script>

    <!-- App Scripts -->
    <script src="./db.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/layers.js"></script>
    <script src="./js/search.js"></script>
    <script src="./js/gps.js"></script>
    <script src="./js/tiles.js"></script>
    <script src="./js/admin.js"></script>
    <script src="./app.js"></script>
</body>
</html>
